<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts load without blocking first paint. An @import at the top of the
         CSS forced the browser to download and parse the stylesheet before it
         even discovered the font request, which on a slow connection delayed
         all text. The system stack in tailwind.config renders meanwhile. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap"
      />
    </noscript>
    <meta name="theme-color" content="#101725" />
    <meta name="author" content="MedEstudia" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://medestudia-v2.vercel.app" />

    <!-- Primary Meta Tags -->
    <title>MedEstudia — Educación Médica para Cuba</title>
    <meta name="description" content="Plataforma educativa basada en inteligencia artificial para estudiantes de ciencias médicas." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://medestudia-v2.vercel.app" />
    <meta property="og:title" content="MedEstudia" />
    <meta property="og:description" content="Plataforma educativa basada en inteligencia artificial para estudiantes de ciencias médicas." />
    <meta property="og:image" content="https://medestudia-v2.vercel.app/og-medestudia.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CU" />
    <meta property="og:site_name" content="MedEstudia" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://medestudia-v2.vercel.app" />
    <meta name="twitter:title" content="MedEstudia" />
    <meta name="twitter:description" content="Plataforma educativa basada en inteligencia artificial para estudiantes de ciencias médicas." />
    <meta name="twitter:image" content="https://medestudia-v2.vercel.app/og-medestudia.png" />

    <!-- LinkedIn (uses OG) -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
